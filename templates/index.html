<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PusoyOS Web Desktop</title>
    <style>
        :root{--accent:#2563eb;--text:#172033;--muted:#64748b;--line:rgba(15,23,42,.12);--surface:#f8fafc;--danger:#dc2626;--ok:#16a34a;--shadow:0 18px 55px rgba(15,23,42,.24)}
        *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 16% 18%,rgba(37,99,235,.55),transparent 28%),radial-gradient(circle at 76% 12%,rgba(20,184,166,.38),transparent 30%),linear-gradient(135deg,#eff6ff,#dbeafe 38%,#f8fafc)}
        button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
        #desktop{position:fixed;inset:0 0 48px 0;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,86px);grid-auto-rows:92px;align-content:start;gap:10px 8px}
        .desktop-icon{width:86px;height:90px;border-radius:8px;display:grid;place-items:center;gap:6px;color:white;text-shadow:0 1px 2px rgba(0,0,0,.35);user-select:none;background:transparent}.desktop-icon:hover,.desktop-icon.selected{background:rgba(255,255,255,.18);outline:1px solid rgba(255,255,255,.28)}
        .app-glyph{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:white;box-shadow:0 8px 18px rgba(15,23,42,.22)}.app-glyph svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.desktop-icon span{font-size:12px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
        #taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(248,250,252,.78);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.65);box-shadow:0 -10px 30px rgba(15,23,42,.12);z-index:5000}
        .task-button,.icon-button{height:36px;border-radius:8px;background:rgba(255,255,255,.7);color:var(--text);border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s}.task-button:hover,.icon-button:hover{background:white;border-color:var(--line)}.icon-button{width:38px;font-weight:800}.start-button{background:var(--accent);color:white}.search-box{width:min(280px,28vw);height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:rgba(255,255,255,.72);outline:none}
        .taskbar-apps{display:flex;gap:6px;min-width:0;overflow:hidden}.taskbar-app{padding:0 10px;max-width:170px;font-size:12px}.taskbar-app.active{border-bottom:3px solid var(--accent);background:white}.task-spacer{flex:1}.tray{display:flex;align-items:center;gap:12px;font-size:12px;color:#334155}.tray strong{font-size:13px;color:#111827}
        .panel{position:fixed;bottom:56px;width:min(620px,calc(100vw - 24px));background:rgba(255,255,255,.9);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.72);border-radius:12px;box-shadow:var(--shadow);z-index:4500;display:none}.panel.active{display:block}#startMenu{left:12px;padding:16px}#quickPanel{right:12px;padding:14px;width:min(390px,calc(100vw - 24px))}.panel-title{font-weight:700;margin-bottom:12px}.start-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.start-app{min-height:76px;padding:10px;border-radius:8px;background:rgba(255,255,255,.62);display:flex;align-items:center;gap:10px;text-align:left;color:var(--text)}.start-app:hover{background:white}.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.quick-tile{padding:12px;border-radius:8px;background:white;border:1px solid var(--line);text-align:left}.quick-tile b{display:block;font-size:18px;margin-bottom:4px}.mini-meter{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.mini-meter div{height:100%;background:var(--accent);width:0}
        .window{position:absolute;display:none;flex-direction:column;min-width:360px;min-height:280px;width:780px;height:540px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);overflow:hidden;z-index:100;transition:box-shadow .2s,transform .1s ease-out}.window.active{display:flex}.window.maximized{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 64px)!important}.window:hover:not(.maximized){box-shadow:0 28px 65px rgba(15,23,42,.38);transform:translateY(-4px)}
        .window-titlebar{height:38px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);cursor:move;user-select:none}.window-title{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:13px;font-weight:700}.small-glyph{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:white}.small-glyph svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.window-controls{display:flex;height:100%}.win-btn{width:46px;background:transparent;color:#334155}.win-btn:hover{background:#e2e8f0}.win-btn.close:hover{background:var(--danger);color:white}.window-body{flex:1;overflow:auto;background:#f8fafc}.resize-grip{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}
        .toolbar{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:white;flex-wrap:wrap}.btn{height:34px;padding:0 12px;border-radius:7px;background:#e2e8f0;color:var(--text);font-weight:600}.btn.primary{background:var(--accent);color:white}.btn.danger{background:var(--danger);color:white}.btn.ok{background:var(--ok);color:white}.field{height:34px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px;background:white;min-width:120px}textarea.field{height:auto;padding:10px;resize:none;line-height:1.5}
        .content-pad{padding:14px}.grid{display:grid;gap:12px}.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:8px;padding:12px}.card h3{margin:0 0 10px;font-size:15px}.metric{font-size:28px;font-weight:800;margin:4px 0}.muted{color:var(--muted);font-size:12px}.status-pill{display:inline-flex;padding:3px 8px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:700}
        .table{width:100%;border-collapse:collapse;background:white;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}.table th{background:#f1f5f9;color:#334155;position:sticky;top:0;z-index:1}.table tr:hover td{background:#eff6ff}
        .split{display:grid;grid-template-columns:240px 1fr;height:100%;min-height:0}.side-list{border-right:1px solid var(--line);background:white;overflow:auto}.list-item{padding:10px 12px;border-bottom:1px solid #eef2f7;cursor:pointer;display:flex;gap:10px;align-items:center}.list-item:hover,.list-item.selected{background:#eff6ff}.editor-area{display:grid;grid-template-rows:auto 1fr;min-height:0}.editor-text{width:100%;height:100%;border:0;outline:0;padding:14px;font-family:Consolas,monospace;font-size:13px;background:#0f172a;color:#dbeafe;resize:none}
        .terminal{background:#07111f;color:#d7fbe8;font-family:Consolas,monospace;height:100%;display:grid;grid-template-rows:1fr auto}.terminal-output{padding:14px;white-space:pre-wrap;overflow:auto;font-size:13px;line-height:1.45}.terminal-input{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(255,255,255,.12)}.terminal-input input{flex:1;background:transparent;color:white;border:0;outline:0}
        .browser-frame{width:100%;height:calc(100% - 55px);border:0;background:white}.note-card{padding:10px;border-radius:8px;border:1px solid #fde68a;background:#fffbeb;cursor:pointer;margin-bottom:8px}.calc{width:min(330px,100%);margin:18px auto;display:grid;gap:8px}.calc-display{height:58px;border-radius:8px;background:#111827;color:white;padding:10px;text-align:right;font-size:26px;overflow:hidden}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{height:48px;border-radius:8px;background:white;border:1px solid var(--line);font-weight:800}.chat{height:100%;display:grid;grid-template-rows:1fr auto;background:#eef2ff}.messages{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:8px}.bubble{max-width:76%;padding:10px 12px;border-radius:12px;background:white;border:1px solid var(--line)}.bubble.me{align-self:flex-end;background:#dbeafe}.chat-input{padding:10px;display:flex;gap:8px;background:white;border-top:1px solid var(--line)}
        .context-menu{position:fixed;display:none;min-width:210px;padding:6px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:8000}.context-menu.active{display:block}.menu-item{width:100%;height:34px;padding:0 10px;border-radius:6px;background:transparent;text-align:left;color:var(--text);display:flex;align-items:center;gap:9px}.menu-item:hover{background:#eff6ff}.menu-sep{height:1px;background:#e5e7eb;margin:6px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.24);display:none;align-items:center;justify-content:center;z-index:8500}.modal-backdrop.active{display:flex}.run-box{width:min(430px,calc(100vw - 28px));background:white;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px}.snap-zone{position:fixed;top:0;bottom:48px;width:50vw;display:none;background:rgba(37,99,235,.13);border:2px solid rgba(37,99,235,.32);z-index:50}.snap-zone.left{left:0}.snap-zone.right{right:0}.snap-zone.active{display:block}.properties-grid{display:grid;grid-template-columns:130px 1fr;gap:8px;font-size:13px}.mini-icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.toast-stack{position:fixed;right:14px;top:14px;z-index:9000;display:grid;gap:8px}#powerScreen{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:10000}#powerScreen.active{display:flex}#powerBtn{width:120px;height:120px;border-radius:50%;border:3px solid #666;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:48px;transition:all .3s;color:#666}#powerBtn:hover{border-color:#999;color:#999;box-shadow:0 0 30px rgba(255,255,255,.1)}#bootScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e1e2e 0%,#282c34 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10000;color:#dbeafe}#bootScreen.active{display:flex}#bootLogo{font-size:48px}#bootText{font-size:18px;color:#60a5fa;font-weight:600}#bootBar{width:240px;height:8px;background:#374151;border-radius:999px;overflow:hidden}#bootBar>div{height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa);width:0;animation:boot 3s ease-out forwards}@keyframes boot{from{width:0}to{width:100%}}
        @media(max-width:760px){ #desktop{grid-template-columns:repeat(auto-fill,76px);padding:10px}.desktop-icon{width:76px}.search-box{display:none}.tray span:not(#clock){display:none}.window{left:6px!important;top:6px!important;width:calc(100vw - 12px)!important;height:calc(100vh - 62px)!important}.split,.cols-2,.cols-3{grid-template-columns:1fr}.side-list{border-right:0;border-bottom:1px solid var(--line);max-height:180px}}
    </style>
</head>
<body>
    <main id="desktop" aria-label="Desktop"></main>
    <section id="startMenu" class="panel" aria-label="Start menu"><div class="panel-title">Pinned apps</div><div id="startGrid" class="start-grid"></div></section>
    <section id="quickPanel" class="panel" aria-label="System panel">
        <div class="panel-title">System status</div>
        <div class="quick-row">
            <div class="quick-tile"><span class="muted">CPU</span><b id="quickCpu">0%</b><div class="mini-meter"><div id="quickCpuBar"></div></div></div>
            <div class="quick-tile"><span class="muted">Memory</span><b id="quickRam">0%</b><div class="mini-meter"><div id="quickRamBar"></div></div></div>
        </div>
        <div id="quickHealth" class="card">Loading health...</div>
    </section>
    <div id="desktopMenu" class="context-menu" role="menu">
        <button class="menu-item" onclick="openApp('dashboard')"><span data-ico="dashboard"></span>Open Dashboard</button>
        <button class="menu-item" onclick="openRunDialog()"><span data-ico="terminal"></span>Run command</button>
        <button class="menu-item" onclick="openApp('filemanager')"><span data-ico="filemanager"></span>New file</button>
        <div class="menu-sep"></div>
        <button class="menu-item" onclick="tileWindows()"><span data-ico="layout"></span>Arrange windows</button>
        <button class="menu-item" onclick="minimizeAll()"><span data-ico="minimize"></span>Show desktop</button>
        <button class="menu-item" onclick="refreshOpenApps()"><span data-ico="refresh"></span>Refresh</button>
    </div>
    <div id="fileMenu" class="context-menu" role="menu">
        <button class="menu-item" onclick="openSelectedFile()"><span data-ico="open"></span>Open</button>
        <button class="menu-item" onclick="showFileProperties()"><span data-ico="info"></span>Properties</button>
        <div class="menu-sep"></div>
        <button class="menu-item" onclick="deleteSelectedFile()"><span data-ico="trash"></span>Delete</button>
    </div>
    <div id="runDialog" class="modal-backdrop">
        <form class="run-box" onsubmit="runDialogCommand(event)">
            <h3 style="margin:0 0 10px">Run</h3>
            <p class="muted">Type an app name, process command, or terminal command.</p>
            <input id="runInput" class="field" style="width:100%" placeholder="Example: terminal, taskmanager, top">
            <div class="toolbar" style="padding:12px 0 0;border:0;justify-content:flex-end">
                <button type="button" class="btn" onclick="runDialog.classList.remove('active')">Cancel</button>
                <button class="btn primary">Run</button>
            </div>
        </form>
    </div>
    <div id="snapLeft" class="snap-zone left"></div>
    <div id="snapRight" class="snap-zone right"></div>
    <div id="powerScreen"><button id="powerBtn" title="Power On" onclick="powerOn()">⏻</button></div>
    <div id="bootScreen"><div id="bootLogo">🖥️</div><div id="bootText">Booting PusoyOS</div><div id="bootBar"><div></div></div></div>
    <div id="toastStack" class="toast-stack"></div>
    <footer id="taskbar">
        <button id="startButton" class="icon-button start-button" title="Start">OS</button>
        <input id="globalSearch" class="search-box" placeholder="Search apps, processes, files" autocomplete="off">
        <div id="taskbarApps" class="taskbar-apps"></div>
        <div class="task-spacer"></div>
        <div class="tray"><span id="trayCpu">CPU 0%</span><span id="trayRam">RAM 0%</span><button class="task-button" title="Restart" onclick="restartSystem()" style="background:#0891b2;color:white">🔄</button><button class="task-button" title="Shutdown" onclick="shutdownSystem()" style="background:#dc2626;color:white">⏻</button><button id="trayButton" class="task-button" title="Open system panel"><strong id="clock">00:00</strong></button></div>
    </footer>
    <script>
        const API='/api';
        const backendApps=new Set(['firefox','vscode','filemanager','terminal','settings','taskmanager','mediaplay','messenger']);
        const appCatalog={dashboard:{name:'Dashboard',icon:'dashboard',color:'#2563eb',desktop:true},project:{name:'Project Check',icon:'info',color:'#0f766e',desktop:true},filemanager:{name:'File Explorer',icon:'folder',color:'#f59e0b',desktop:true},taskmanager:{name:'Task Manager',icon:'activity',color:'#16a34a',desktop:true},terminal:{name:'Terminal',icon:'terminal',color:'#111827',desktop:true},settings:{name:'Settings',icon:'settings',color:'#64748b',desktop:true},monitor:{name:'Monitor',icon:'monitor',color:'#0891b2',desktop:true},firefox:{name:'Browser',icon:'globe',color:'#ea580c',desktop:true},vscode:{name:'Code Editor',icon:'code',color:'#0284c7',desktop:false},notes:{name:'Notes',icon:'note',color:'#ca8a04',desktop:false},calculator:{name:'Calculator',icon:'calculator',color:'#7c3aed',desktop:false},messenger:{name:'Messenger',icon:'message',color:'#0d9488',desktop:false},mediaplay:{name:'Media Player',icon:'music',color:'#db2777',desktop:false},camera:{name:'Camera',icon:'camera',color:'#ec4899',desktop:false},recycle:{name:'Recycle Bin',icon:'trash',color:'#475569',desktop:true}};
        const openWindows={};let zCounter=100,selectedFile=null,selectedFileInfo=null,selectedPid=null,selectedTask=null,taskView='apps',calcValue='0';
        const state={notes:JSON.parse(localStorage.getItem('pusoy_notes')||'[]'),messages:[]};
        function appMeta(id){return appCatalog[id]||{name:id,icon:'window',color:'#475569'}}
        const icons={dashboard:'<path d="M3 13h8V3H3z"></path><path d="M13 21h8V11h-8z"></path><path d="M13 3h8v6h-8z"></path><path d="M3 21h8v-6H3z"></path>',folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"></path>',terminal:'<path d="m4 7 5 5-5 5"></path><path d="M12 19h8"></path>',settings:'<circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20h-3v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3v-3h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1A1.7 1.7 0 0 0 8.2 5a1.7 1.7 0 0 0 1-1.5V3h3v.5a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.7v3h-.7a1.7 1.7 0 0 0-1.5 1z"></path>',monitor:'<rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path>',globe:'<circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18"></path><path d="M12 3a14 14 0 0 0 0 18"></path>',code:'<path d="m8 9-4 3 4 3"></path><path d="m16 9 4 3-4 3"></path><path d="m14 4-4 16"></path>',note:'<path d="M5 3h10l4 4v14H5z"></path><path d="M15 3v5h5"></path><path d="M8 13h8"></path><path d="M8 17h6"></path>',calculator:'<rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8"></path><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"></path>',message:'<path d="M4 5h16v11H7l-3 3z"></path>',music:'<path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle>',trash:'<path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 14h10l1-14"></path><path d="M9 7V4h6v3"></path>',layout:'<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M12 4v16"></path><path d="M3 10h18"></path>',minimize:'<path d="M5 12h14"></path>',refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v6h-6"></path>',open:'<path d="M14 3h7v7"></path><path d="M10 14 21 3"></path><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"></path>',info:'<circle cx="12" cy="12" r="9"></circle><path d="M12 10v6"></path><path d="M12 7h.01"></path>',camera:'<path d="M14 17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2l2-3h2l2 3h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2z"></path><circle cx="9.5" cy="11.5" r="2.5"></circle>',window:'<rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18"></path>'};
        function icon(name,cls='mini-icon'){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.window}</svg>`}
        function glyph(meta,cls='small-glyph'){return '<span class="'+cls+'" style="background:'+meta.color+'">'+icon(meta.icon,'')+'</span>'}
        function fmt(n,d=0){const x=Number(n||0);return Number.isFinite(x)?x.toFixed(d):'0'}
        function html(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
        async function api(path,method='GET',body=null){const opt={method,headers:{'Content-Type':'application/json'}};if(body)opt.body=JSON.stringify(body);const res=await fetch(path,opt);const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||data.error||'Request failed');return data}
        function toast(message,type='info'){const el=document.createElement('div');el.className='card';el.style.cssText='min-width:240px;border-left:4px solid '+(type==='error'?'var(--danger)':'var(--accent)');el.textContent=message;toastStack.appendChild(el);setTimeout(()=>el.remove(),3200)}
        function renderDesktop(){desktop.innerHTML=Object.entries(appCatalog).filter(([,a])=>a.desktop).map(([id,m])=>`<button class="desktop-icon" data-app="${id}" ondblclick="openApp('${id}')" onclick="selectDesktopIcon(this)">${glyph(m,'app-glyph')}<span>${m.name}</span></button>`).join('');renderStartMenu();hydrateInlineIcons()}
        function renderStartMenu(filter=''){const q=filter.toLowerCase();startGrid.innerHTML=Object.entries(appCatalog).filter(([id,m])=>!q||m.name.toLowerCase().includes(q)||id.includes(q)).map(([id,m])=>`<button class="start-app" onclick="openApp('${id}')">${glyph(m,'app-glyph')}<span><b>${m.name}</b><br><span class="muted">${m.desktop?'Desktop app':'Utility app'}</span></span></button>`).join('')}
        function selectDesktopIcon(el){document.querySelectorAll('.desktop-icon').forEach(i=>i.classList.remove('selected'));el.classList.add('selected');globalSearch.value=appMeta(el.dataset.app).name}

estartSystem()">Restart</button><button class="btn danger" onclick="shutdownSystem()">Shutdown</button></div></div></div>`}
        function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('pusoy_accent',c)}async function setMemoryAlgorithm(){const r=await api(`${API}/set-memory-allocation-algorithm`,'POST',{algorithm:memAlg.value});toast(r.message||'Memory algorithm updated')}async function compactMemory(){const r=await api(`${API}/memory-compaction`,'POST',{});toast(r.message||'Memory compaction complete');refreshOpenApps()}
        async function monitor(){const[h,a,e,r]=await Promise.all([api(`${API}/system-health`),api(`${API}/resource-analysis`),api(`${API}/system-events?limit=12`),api(`${API}/analytics-report`)]);return `<div class="content-pad grid cols-2"><div class="card"><h3>Health</h3><div class="metric">${h.status}</div><p class="muted">${h.issues.join(', ')||'No active issues'}</p></div><div class="card"><h3>Resource Analysis</h3><p>CPU capacity available: <b>${fmt(a.cpu.available_capacity)}%</b></p><p>Memory fragmentation: <b>${a.memory.fragmentation}</b></p><p>Queue length: <b>${a.processes.queue_length}</b></p></div><div class="card"><h3>Analytics</h3><p>Total processes: <b>${r.total_processes}</b></p><p>Completed: <b>${r.completed_processes}</b></p><p>Avg wait: <b>${r.statistics.average_wait_time}</b></p></div><div class="card"><h3>Event Log</h3>${e.events.map(x=>`<p><b>${html(x.type)}</b><br><span class="muted">${new Date(x.timestamp).toLocaleTimeString()}</span></p>`).join('')||'<p class="muted">No events yet</p>'}</div></div>`}
        async function firefox(){return `<div class="toolbar"><input id="browserUrl" class="field" style="flex:1" value="https://example.com"><button class="btn primary" onclick="loadBrowserUrl()">Go</button><button class="btn" onclick="browserHome()">Home</button></div><iframe id="browserFrame" class="browser-frame" sandbox="allow-scripts allow-forms allow-same-origin" srcdoc="${html(browserHomeDoc())}"></iframe>`}
        function browserHomeDoc(){return '<style>body{font-family:Segoe UI;padding:28px;background:#f8fafc;color:#172033}button{padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:white}</style><h1>PusoyOS Browser</h1><p>Enter a URL above. Some sites block iframe viewing, so local tools and documentation are provided here.</p><p><b>Try:</b> https://example.com</p>'}function loadBrowserUrl(){let u=browserUrl.value.trim();if(!/^https?:\/\//.test(u))u='https://'+u;browserFrame.src=u}function browserHome(){browserFrame.srcdoc=browserHomeDoc()}
        async function vscode(){selectedFile=selectedFile||'main.py';return filemanager()}
        async function notes(){return `<div class="split"><div class="side-list"><div class="toolbar"><button class="btn primary" onclick="addNote()">Add note</button></div><div class="content-pad">${state.notes.map((n,i)=>`<div class="note-card" onclick="editNote(${i})"><b>${html(n.title)}</b><br><span class="muted">${html(n.body.slice(0,70))}</span></div>`).join('')||'<span class="muted">No notes yet</span>'}</div></div><div class="content-pad"><input id="noteTitle" class="field" style="width:100%;margin-bottom:8px" placeholder="Title"><textarea id="noteBody" class="field" style="width:100%;height:260px" placeholder="Write a note"></textarea><div class="toolbar"><button class="btn primary" onclick="saveNote()">Save note</button></div></div></div>`}
        function addNote(){noteTitle.value='';noteBody.value='';delete noteTitle.dataset.index}function editNote(i){noteTitle.value=state.notes[i].title;noteBody.value=state.notes[i].body;noteTitle.dataset.index=i}function saveNote(){const i=noteTitle.dataset.index,n={title:noteTitle.value||'Untitled',body:noteBody.value};if(i)state.notes[i]=n;else state.notes.unshift(n);localStorage.setItem('pusoy_notes',JSON.stringify(state.notes));toast('Note saved');renderApp('notes')}
        async function calculator(){return `<div class="calc"><div id="calcDisplay" class="calc-display">${html(calcValue)}</div><div class="calc-grid">${['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'].map(v=>`<button onclick="calcPress('${v}')">${v}</button>`).join('')}</div></div>`}
        function calcPress(v){if(v==='C')calcValue='0';else if(v==='='){try{calcValue=String(Function('return '+calcValue)())}catch{calcValue='Error'}}else calcValue=calcValue==='0'||calcValue==='Error'?v:calcValue+v;calcDisplay.textContent=calcValue}
        async function messenger(){if(!state.messages.length)state.messages.push({from:'bot',text:'Hi. I can explain OS commands, processes, scheduling, and files inside this demo.'});return `<div class="chat"><div id="messages" class="messages">${state.messages.map(m=>`<div class="bubble ${m.from==='me'?'me':''}">${html(m.text)}</div>`).join('')}</div><form class="chat-input" onsubmit="sendMessage(event)"><input id="chatText" class="field" style="flex:1" placeholder="Ask about the OS simulator"><button class="btn primary">Send</button></form></div>`}
        function sendMessage(e){e.preventDefault();const text=chatText.value.trim();if(!text)return;state.messages.push({from:'me',text});const l=text.toLowerCase(),reply=l.includes('process')?'Open Task Manager to create, step, and terminate simulator processes.':l.includes('file')?'File Explorer can create, edit, save, read, and delete files through Flask APIs.':'Try Terminal commands like help, top, ps, metrics, events, and health.';state.messages.push({from:'bot',text:reply});renderApp('messenger')}
        async function mediaplay(){return `<div class="content-pad"><div class="card"><h3>Media Player</h3><p class="muted">A working web audio player using generated tones.</p><div class="toolbar"><button class="btn primary" onclick="playTone(261.63)">Play C</button><button class="btn" onclick="playTone(329.63)">Play E</button><button class="btn" onclick="playTone(392)">Play G</button></div></div></div>`}
        async function camera(){let html='<div class="content-pad"><div class="card"><h3>Camera App</h3><p class="muted">Access your device camera (if permitted).</p><video id="cameraVideo" style="width:100%;height:300px;background:#000;border-radius:8px;margin:10px 0" autoplay playsinline></video><div class="toolbar"><button class="btn primary" id="startCameraBtn" onclick="startCamera()">Start Camera</button><button class="btn" id="snapCameraBtn" onclick="takeSnapshot()" style="display:none">Snapshot</button><button class="btn" id="stopCameraBtn" onclick="stopCamera()" style="display:none">Stop Camera</button></div></div><canvas id="cameraCanvas" style="display:none"></canvas></div>';return html}
        async function startCamera(){const video=document.getElementById('cameraVideo'),btn=document.getElementById('startCameraBtn'),snap=document.getElementById('snapCameraBtn'),stop=document.getElementById('stopCameraBtn');try{const stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;btn.style.display='none';snap.style.display='inline-block';stop.style.display='inline-block';toast('Camera started')}catch(e){toast('Camera access denied or unavailable','error')}}
        function stopCamera(){const video=document.getElementById('cameraVideo'),btn=document.getElementById('startCameraBtn'),snap=document.getElementById('snapCameraBtn'),stop=document.getElementById('stopCameraBtn');const tracks=video.srcObject.getTracks();tracks.forEach(t=>t.stop());video.srcObject=null;btn.style.display='inline-block';snap.style.display='none';stop.style.display='none'}
        function takeSnapshot(){const video=document.getElementById('cameraVideo'),canvas=document.getElementById('cameraCanvas'),ctx=canvas.getContext('2d');canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);const img=canvas.toDataURL('image/png');const link=document.createElement('a');link.href=img;link.download='snapshot-'+Date.now()+'.png';link.click();toast('Snapshot saved')}
        function playTone(freq){const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.value=.08;osc.connect(gain);gain.connect(ctx.destination);osc.start();setTimeout(()=>{osc.stop();ctx.close()},450)}
        function changeBg(value){document.body.style.background=value;localStorage.setItem('pusoy_bg',value);toast('Background updated')}
        async function restartSystem(){const confirmed=confirm('Restart the operating system? All running applications will be closed.');if(!confirmed)return;try{toast('System restarting...','info');document.getElementById('bootScreen').classList.add('active');document.getElementById('desktop').style.display='none';document.getElementById('taskbar').style.display='none';try{await api(`${API}/restart`,'POST',{save_state:true})}catch(e){console.warn('Restart API error (continuing anyway):',e)}setTimeout(()=>{document.getElementById('bootScreen').classList.remove('active');document.getElementById('desktop').style.display='grid';document.getElementById('taskbar').style.display='flex';location.reload()},3500)}catch(e){console.error('Restart error:',e);toast('Restart failed: '+e.message,'error');document.getElementById('bootScreen').classList.remove('active');document.getElementById('desktop').style.display='grid';document.getElementById('taskbar').style.display='flex'}}
        async function shutdownSystem(){const confirmed=confirm('Shutdown the operating system? All running applications will be closed.');if(!confirmed)return;try{toast('System shutting down...','info');try{await api(`${API}/shutdown`,'POST',{force:false})}catch(e){console.warn('Shutdown API error (continuing anyway):',e)}setTimeout(()=>{Object.keys(openWindows).forEach(id=>{if(openWindows[id])openWindows[id].remove();delete openWindows[id]});document.getElementById('desktop').style.display='none';document.getElementById('taskbar').style.display='none';document.getElementById('powerScreen').classList.add('active');localStorage.setItem('pusoy_shutdown',true);toast('System shutdown complete')},1500)}catch(e){console.error('Shutdown error:',e);toast('Shutdown failed: '+e.message,'error')}}
        function powerOn(){localStorage.removeItem('pusoy_shutdown');document.getElementById('powerScreen').classList.remove('active');document.getElementById('desktop').style.display='grid';document.getElementById('taskbar').style.display='flex';location.reload()}
        function checkShutdownState(){if(localStorage.getItem('pusoy_shutdown')){document.getElementById('desktop').style.display='none';document.getElementById('taskbar').style.display='none';document.getElementById('powerScreen').classList.add('active')}}

        async function refreshOpenApps(){for(const id of Object.keys(openWindows))if(openWindows[id].classList.contains('active'))await renderApp(id);await updateSystemInfo();renderTaskbar()}
        async function updateSystemInfo(){try{const[mr,h]=await Promise.all([api(`${API}/system-metrics`),api(`${API}/system-health`)]),m=mr.metrics;trayCpu.textContent='CPU '+fmt(m.cpu_utilization)+'%';trayRam.textContent='RAM '+fmt(m.memory_utilization)+'%';quickCpu.textContent=fmt(m.cpu_utilization)+'%';quickRam.textContent=fmt(m.memory_utilization)+'%';quickCpuBar.style.width=fmt(m.cpu_utilization)+'%';quickRamBar.style.width=fmt(m.memory_utilization)+'%';quickHealth.innerHTML=`<b>${h.status}</b><p class="muted">${h.issues.join(', ')||'System is healthy'}</p>`}catch{}clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
        startButton.addEventListener('click',()=>startMenu.classList.toggle('active'));trayButton.addEventListener('click',()=>quickPanel.classList.toggle('active'));globalSearch.addEventListener('input',e=>{startMenu.classList.add('active');renderStartMenu(e.target.value)});
        desktop.addEventListener('contextmenu',e=>{e.preventDefault();showMenu(desktopMenu,e.clientX,e.clientY)});
        document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();hideMenus();runDialog.classList.remove('active')}if(e.ctrlKey&&e.key.toLowerCase()==='r'){e.preventDefault();openRunDialog()}if(e.ctrlKey&&e.key.toLowerCase()==='m'){e.preventDefault();minimizeAll()}if(e.key==='Delete'&&selectedFile&&openWindows.filemanager?.classList.contains('active'))deleteSelectedFile()});
        document.addEventListener('click',e=>{if(!e.target.closest('.panel')&&!e.target.closest('#startButton')&&!e.target.closest('#trayButton')&&!e.target.closest('#globalSearch'))closePanels();if(!e.target.closest('.context-menu'))hideMenus()});
        document.addEventListener('dblclick',e=>{if(e.target.id==='desktop')openApp('filemanager')});
        const savedAccent=localStorage.getItem('pusoy_accent');if(savedAccent)setAccent(savedAccent);const savedBg=localStorage.getItem('pusoy_bg');if(savedBg)changeBg(savedBg);checkShutdownState();renderDesktop();hydrateInlineIcons();updateSystemInfo();setInterval(updateSystemInfo,2500);if(!localStorage.getItem('pusoy_shutdown'))openApp('dashboard');
    </script>
</body>
</html>
